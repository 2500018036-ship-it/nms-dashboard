map $http_origin $nms_origin_allowed {
    default 0;
    "" 1;
    "https://nms.azrilachdi.web.id" 1;
}
map $http_origin $nms_backend_origin {
    default "";
    "https://nms.azrilachdi.web.id" "http://127.0.0.1:8765";
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name nms.azrilachdi.web.id localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /deployment.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /nms-api { return 404; }
    location /nms-api/ {
        if ($nms_origin_allowed = 0) { return 403; }
        if ($http_sec_fetch_site = cross-site) { return 403; }
        # A POST must carry the verified public HTTPS origin before it is
        # translated to the backend's existing loopback-only origin contract.
        set $nms_post_origin "$request_method:$http_origin";
        if ($nms_post_origin = "POST:") { return 403; }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nms_backend http://nms-bot:8765;
        rewrite ^/nms-api/(.*)$ /$1 break;
        proxy_pass $nms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin $nms_backend_origin;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
