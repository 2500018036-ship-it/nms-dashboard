# Installed at /data/nginx/custom/http_top.conf in the existing NPM instance.
# NMS has its own virtual host; it does not replace NPM-managed proxy hosts.
server {
    listen 80;
    server_name nms.azrilachdi.web.id;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;
    location / {
        set $dashboard http://nms-dashboard:8080;
        proxy_pass $dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
